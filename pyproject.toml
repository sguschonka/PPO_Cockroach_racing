[tool.poetry]
name = "cockroach racing PPO"
version = "0.1.0"
description = "This project involves training a PPO agent to navigate a cockroach along various tracks. Much like in standard races."
authors = ["Alexander Klepikov <sklepikov2007@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "==2.5.0"
pygame = "==2.6.1"
gymnasium = "==1.3.0"
tensorflow = "==2.21.0"
ruff = "==0.15.20"
optuna = "==4.9.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
